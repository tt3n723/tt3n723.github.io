<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-width="9">
  <!-- 死亡圣器：三角（隐形衣）+ 内切圆（复活石）+ 中线（老魔杖） -->
  <!-- 三个都是"描边"，和原来的 favicon 一样只用一个颜色、背景透明 -->
  <path d="M64 12 L119 116 L9 116 Z" />
  <circle cx="64" cy="82.9" r="33.1" />
  <path d="M64 12 V116" />
  <style>
    /* 跟随浏览器标签栏的明暗自动换色 —— 浅色栏用黑线，深色栏用白线 */
    path,
    circle {
      stroke: #000;
    }
    @media (prefers-color-scheme: dark) {
      path,
      circle {
        stroke: #fff;
      }
    }
  </style>
</svg>
